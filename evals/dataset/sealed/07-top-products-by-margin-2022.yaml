id: sealed-07
question: Какие десять товаров принесли больше всего маржи в двадцать втором?
asked_by: финансовый директор
difficulty: complex
kind: answerable
metrics: [margin]
gotchas: [cost-grain-explosion, margin-join-grain, netpr-is-not-revenue]
expected_tools: [describe_schema, propose_query, execute_query, sanity_check]
max_steps: 10
gold_sql: |
  SELECT m.maktx AS product, SUM(v.netwr - z.stprs * v.fkimg) AS margin
  FROM sh.zvbrp v
  JOIN sh.zkeko z ON z.matnr = v.matnr AND z.kadat = v.fkdat
                 AND z.vtweg = v.vtweg AND z.aktnr = v.aktnr
                 AND z.mandt = v.mandt
  JOIN sh.zmara m ON m.matnr = v.matnr AND m.mandt = v.mandt
  JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
  WHERE v.mandt = '100' AND m.lvorm = ' ' AND p.gjahr = 2022
  GROUP BY m.maktx
  ORDER BY margin DESC
  FETCH FIRST 10 ROWS ONLY
expect:
  key_columns: [PRODUCT]
  measure_columns: [MARGIN]
  guard: passed
notes: >
  Соединение по четырём полям плюс мандант, справочник материалов для названия
  и календарь для года. Пять таблиц, порог автовыполнения три, поэтому
  предложение обязано уйти на подтверждение аналитику.
