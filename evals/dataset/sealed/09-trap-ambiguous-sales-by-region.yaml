id: sealed-09
question: Слушай, дай продажи по регионам за квартал, срочно надо.
asked_by: коммерческий директор
difficulty: medium
kind: trap
trap_type: ambiguous
gotchas: [regio-vs-region]
expected_tools: [describe_schema]
instructions: [INSTR-9]
max_steps: 6
expect:
  guard: not-applicable
  refusal_reason: >
    Не назван ни квартал, ни уровень географии. Регион в этой схеме означает
    две разные вещи: область внутри страны и макрорегион. Выбрать за
    спрашивающего значит выдать правдоподобное число не на тот вопрос.
  must_not:
    - подставить последний доступный квартал молча
    - выбрать уровень географии за спрашивающего
  should_offer: >
    Два уточняющих вопроса и предложение показать оба разреза за последний
    закрытый квартал, если ответ нужен немедленно.
notes: >
  Формулировка взята дословно из мок-интервью Р1, блок 1. Там ведущий аналитик
  говорит, что переспрашивал дважды. Это тот же случай.
