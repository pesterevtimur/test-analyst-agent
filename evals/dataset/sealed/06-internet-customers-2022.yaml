id: sealed-06
question: Сколько разных клиентов купили через интернет в двадцать втором?
asked_by: руководитель маркетинга
difficulty: medium
kind: answerable
metrics: [customers_count]
gotchas: [customers-need-distinct, vtweg-padding]
expected_tools: [describe_schema, propose_query, execute_query]
max_steps: 8
gold_sql: |
  SELECT COUNT(DISTINCT v.kunnr) AS customers
  FROM sh.zvbrp v
  JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
  WHERE v.mandt = '100' AND v.vtweg = '04' AND p.gjahr = 2022
expect:
  key_columns: []
  measure_columns: [CUSTOMERS]
  guard: passed
notes: >
  Код канала строкой с ведущим нулём и обязательный DISTINCT в одном коротком
  запросе.
