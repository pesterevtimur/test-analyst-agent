id: sealed-08
question: Как менялась доля промо по кварталам двадцать второго года?
asked_by: руководитель маркетинга
difficulty: complex
kind: answerable
metrics: [promo_share]
gotchas: [promo-placeholder, quartal-format]
expected_tools: [describe_schema, propose_query, execute_query]
max_steps: 10
gold_sql: |
  SELECT p.quartal AS quarter,
         SUM(CASE WHEN v.aktnr <> '0000000999' THEN v.netwr ELSE 0 END)
         / NULLIF(SUM(v.netwr), 0) AS promo_share
  FROM sh.zvbrp v
  JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
  WHERE v.mandt = '100' AND p.gjahr = 2022
  GROUP BY p.quartal
  ORDER BY quarter
expect:
  key_columns: [QUARTER]
  measure_columns: [PROMO_SHARE]
  guard: passed
notes: >
  Динамика доли, а не суммы. Проверяет одновременно исключение заглушки и
  разрез по кварталу в правильном формате.
