id: sealed-10
question: Сравни выручку двадцать второго года с планом, где недобрали?
asked_by: финансовый директор
difficulty: complex
kind: trap
trap_type: no-data
gotchas: []
expected_tools: [describe_schema]
max_steps: 6
expect:
  guard: not-applicable
  refusal_reason: >
    Плана в витрине нет. Ни в одной из восьми таблиц allowlist нет плановых
    сумм: плановая цена VERPR в калькуляции это цена единицы, а не план продаж.
    Правильный ответ это отказ с указанием, что план лежит вне этих данных.
  must_not:
    - выдать плановую цену VERPR за план продаж
    - придумать план от прошлого года
  should_offer: >
    Факт по выручке за 2022 год в нужном разрезе, чтобы аналитик сопоставил его
    с планом из своего источника.
notes: >
  Ловушка с приманкой: в словаре есть слово «плановая», и оно относится к
  другому. Проверяется, что агент читает описание поля, а не его название.
