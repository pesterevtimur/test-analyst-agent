id: sealed-04
question: Разложи выручку двадцать первого года по типам акций.
asked_by: руководитель маркетинга
difficulty: medium
kind: answerable
metrics: [promo_revenue]
gotchas: [promo-placeholder-row]
expected_tools: [describe_schema, propose_query, execute_query]
max_steps: 8
gold_sql: |
  SELECT a.akart AS promo_type, SUM(v.netwr) AS revenue
  FROM sh.zvbrp v
  JOIN sh.wakh a ON a.aktnr = v.aktnr AND a.mandt = v.mandt
  JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
  WHERE v.mandt = '100' AND v.aktnr <> '0000000999' AND p.gjahr = 2021
  GROUP BY a.akart
  ORDER BY revenue DESC
expect:
  key_columns: [PROMO_TYPE]
  measure_columns: [REVENUE]
  guard: passed
notes: >
  Тип акции лежит в заголовке акции, а заглушка «без акции» тоже имеет свой
  тип и без фильтра станет крупнейшим типом.
  Замер 3 сентября: настоящий тип акции в 2021 году один.
