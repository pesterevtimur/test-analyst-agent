id: open-18
question: Дай выручку за двадцать третий год.
asked_by: финансовый контролёр
difficulty: simple
kind: trap
trap_type: no-data
gotchas: [data-range]
expected_tools: [describe_schema, propose_query, execute_query]
instructions: [INSTR-8, INSTR-11]
max_steps: 8
expect:
  guard: passed
  refusal_reason: >
    Календарь покрывает 2019-2023 годы, а продажи заканчиваются 31 декабря
    2022 года. Запрос за 2023 год отработает без ошибки и вернёт пусто.
    Правильный ответ говорит, что данных за этот период в реплике нет, и
    называет доступный диапазон. Ноль как ответ на вопрос о выручке
    неправильный: он означает «продавали и не продали», а не «данных нет».
  must_not:
    - назвать ноль выручкой за год
    - додумать число из соседних лет
  should_offer: >
    Выручку за 2022 год и дату, на которую обновлена отчётная реплика.
notes: >
  Единственная ловушка набора, где запрос законен и проходит все ограничители.
  Ошибка живёт не в SQL, а в толковании пустого результата. Замер 3 сентября:
  максимальная дата фактуры 2022-12-31, максимальная дата календаря 2023-12-31.
