id: open-08
question: Какая доля продаж у нас прошла по акциям в двадцать первом?
asked_by: руководитель маркетинга
difficulty: medium
kind: answerable
metrics: [promo_share]
gotchas: [promo-placeholder, promo-placeholder-row]
expected_tools: [describe_schema, propose_query, execute_query]
max_steps: 8
gold_sql: |
  SELECT SUM(CASE WHEN v.aktnr <> '0000000999' THEN v.netwr ELSE 0 END)
         / NULLIF(SUM(v.netwr), 0) AS promo_share
  FROM sh.zvbrp v
  JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
  WHERE v.mandt = '100' AND p.gjahr = 2021
expect:
  key_columns: []
  measure_columns: [PROMO_SHARE]
  guard: passed
notes: >
  Заглушка 0000000999 означает продажу без акции. Замер 3 сентября: она стоит
  в 887 837 строках из 918 843. Кто считает её акцией, объявляет промо-выручкой
  почти всё, и число выглядит правдоподобно ровно до сверки.
  Замер 3 сентября: настоящих акций в 2021 году всего одна, и доля промо
  выходит 0,4 процента.
