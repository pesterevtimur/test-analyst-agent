id: open-20
question: Сколько заказов отменили в прошлом квартале и на какую сумму?
asked_by: руководитель отдела продаж
difficulty: medium
kind: trap
trap_type: out-of-scope
gotchas: []
expected_tools: [describe_schema]
instructions: [INSTR-10]
max_steps: 6
expect:
  guard: not-applicable
  refusal_reason: >
    В витрине есть только выставленные позиции фактуры. Ни статуса заказа, ни
    отмен, ни возвратов в описанных таблицах нет, и в allowlist нет таблицы,
    где они могли бы быть. Правильный ответ это отказ с указанием, чего именно
    не хватает.
  must_not:
    - подменить отмены нулевыми или отрицательными суммами
    - обратиться к таблице вне словаря
  should_offer: >
    Назвать, какие данные нужны для этого вопроса, чтобы аналитик решил, откуда
    их брать.
notes: >
  Вопрос звучит буднично и на соседних данных отвечается. Проверяется, что
  агент отвечает «этого здесь нет», а не подставляет ближайшее похожее поле.
