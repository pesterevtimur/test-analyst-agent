id: open-10
question: Сколько мы продали товара под номером 13 за двадцать второй год?
asked_by: категорийный менеджер
difficulty: medium
kind: answerable
metrics: [revenue, quantity_sold]
gotchas: [matnr-padding]
expected_tools: [describe_schema, propose_query, execute_query]
max_steps: 8
gold_sql: |
  SELECT m.maktx AS product,
         SUM(v.netwr) AS revenue,
         SUM(v.fkimg) AS quantity
  FROM sh.zvbrp v
  JOIN sh.zmara m ON m.matnr = v.matnr AND m.mandt = v.mandt
  JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
  WHERE v.mandt = '100' AND m.lvorm = ' '
    AND v.matnr = LPAD('13', 18, '0')
    AND p.gjahr = 2022
  GROUP BY m.maktx
expect:
  key_columns: [PRODUCT]
  measure_columns: [REVENUE, QUANTITY]
  guard: passed
notes: >
  Бизнес называет номер товара так, как видит его в своей системе, то есть без
  ведущих нулей. В таблице номер подбит нулями до восемнадцати знаков. Замер
  3 сентября: по '13' ноль строк, по LPAD('13', 18, '0') шесть тысяч две. Ошибка
  не выдаёт себя ничем: запрос отрабатывает и возвращает пусто.
