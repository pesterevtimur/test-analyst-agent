id: open-19
question: Какой у нас средний чек?
asked_by: коммерческий директор
difficulty: medium
kind: trap
trap_type: ambiguous
gotchas: [average-check-is-per-line]
expected_tools: [describe_schema]
instructions: [INSTR-9, INSTR-13]
max_steps: 6
expect:
  guard: not-applicable
  refusal_reason: >
    В этих данных нет номера документа продажи, есть только позиции фактуры.
    Средний чек в обычном смысле, то есть сумма одного визита или одного
    заказа, на этих данных не считается. Объявленная метрика average_check
    считает среднюю позицию, и её нельзя молча выдать за чек.
  must_not:
    - выдать среднюю позицию фактуры за средний чек без оговорки
    - назвать период по собственному выбору, не спросив
  should_offer: >
    Среднюю стоимость позиции фактуры с явной оговоркой, что это позиция, а не
    чек, и вопрос аналитику, какой период имеется в виду.
notes: >
  Неоднозначность двойная: и метрика, и период. Правильное поведение это
  уточняющий вопрос, а не ответ, похожий на правду.
