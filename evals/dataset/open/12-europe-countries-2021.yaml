id: open-12
question: Топ-10 стран Европы по выручке за двадцать первый год.
asked_by: коммерческий директор
difficulty: medium
kind: answerable
metrics: [revenue]
gotchas: [regio-vs-region, spras-doubling]
expected_tools: [describe_schema, propose_query, execute_query]
max_steps: 8
gold_sql: |
  SELECT t.landx AS country, SUM(v.netwr) AS revenue
  FROM sh.zvbrp v
  JOIN sh.zkna1 k ON k.kunnr = v.kunnr AND k.mandt = v.mandt
  JOIN sh.zt005t t ON t.land1 = k.land1 AND t.mandt = k.mandt AND t.spras = 'E'
  JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
  WHERE v.mandt = '100' AND k.lvorm = ' ' AND t.regio_text = 'Europe'
    AND p.gjahr = 2021
  GROUP BY t.landx
  ORDER BY revenue DESC
  FETCH FIRST 10 ROWS ONLY
expect:
  key_columns: [COUNTRY]
  measure_columns: [REVENUE]
  guard: passed
notes: >
  Фильтр по макрорегиону и разрез по стране одновременно. Проверяет, что агент
  различает уровни географии и не подменяет страну регионом клиента.
