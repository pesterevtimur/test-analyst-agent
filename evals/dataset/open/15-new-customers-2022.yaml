id: open-15
question: Сколько клиентов покупали в двадцать втором, а в двадцать первом не покупали?
asked_by: руководитель отдела продаж
difficulty: complex
kind: answerable
metrics: [customers_count]
gotchas: [customers-need-distinct]
expected_tools: [describe_schema, propose_query, execute_query]
max_steps: 10
gold_sql: |
  SELECT COUNT(*) AS customers
  FROM (
    SELECT DISTINCT v.kunnr AS kunnr
    FROM sh.zvbrp v
    JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
    WHERE v.mandt = '100' AND p.gjahr = 2022
    MINUS
    SELECT DISTINCT v.kunnr AS kunnr
    FROM sh.zvbrp v
    JOIN sh.zt009b p ON p.budat = v.fkdat AND p.mandt = v.mandt
    WHERE v.mandt = '100' AND p.gjahr = 2021
  )
expect:
  key_columns: []
  measure_columns: [CUSTOMERS]
  guard: passed
notes: >
  Единственный вопрос набора, где нужна разность множеств. Проверяет заодно,
  что ограничители пропускают вложенный запрос и MINUS: если не пропускают, то
  запрещён законный класс вопросов, и это дефект ограничителя, а не запроса.
