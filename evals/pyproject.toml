[project]
name = "sap-agent-evals"
version = "0.1.0"
description = "Reference set and result comparison for the analyst agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
