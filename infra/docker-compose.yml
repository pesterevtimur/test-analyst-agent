# All service ports bind to 127.0.0.1 only. Nothing is exposed to the network.
# Reach the panel and traces through an ssh tunnel.

name: sap-agent

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: sap-agent-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      ORACLE_APP_USER: ${ORACLE_APP_USER:-agent_ro}
      ORACLE_APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:?set ORACLE_APP_USER_PASSWORD in .env}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
      - ./oracle/vendor/sales_history:/opt/sh:ro
    # Oracle Database Free is licence-capped at 2 GB RAM, 2 CPUs and 12 GB of
    # user data, so the SGA cannot exceed 2 GB. The rest of this budget is
    # headroom for the client processes that run inside the container during
    # setup, chiefly sqlldr.
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  mcp:
    build:
      context: ../mcp_server
    container_name: sap-agent-mcp
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORACLE_APP_USER: ${ORACLE_APP_USER:-agent_ro}
      ORACLE_APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:?set ORACLE_APP_USER_PASSWORD in .env}
      # The reporting replica, never the transactional database. The agent has
      # no account on FREEPDB1 at all, so this is a boundary and not a setting.
      ORACLE_DSN: oracle:1521/REPPDB1
      SEMANTIC_SOURCES: semantic/sap
      STATE_PATH: /state/sap-agent.db
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
      # Until the gateway is confirmed to forward the analyst identity, every
      # call without the header is attributed here. The open question and its
      # fallback are in SPEC.md, section 11.
      DEFAULT_ANALYST_ID: ${DEFAULT_ANALYST_ID:-analyst-unknown}
      # Tracing. Without these three the tracer is a no-op and the server runs
      # exactly the same way, which is the point: observability must not be able
      # to stop the thing it observes.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
    ports:
      # 0.0.0.0 inside the container, 127.0.0.1 on the host: nothing is exposed.
      - "127.0.0.1:8080:8080"
    volumes:
      - mcp-state:/state
    mem_limit: 512m
    networks:
      - default
      # Langfuse runs as its own compose project; the server reaches it by
      # service name instead of through a port published on the host.
      - observability

  panel:
    build:
      context: ..
      dockerfile: control_panel/Dockerfile
    container_name: sap-agent-panel
    restart: unless-stopped
    depends_on:
      - mcp
    environment:
      STATE_PATH: /state/sap-agent.db
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 8081
      PANEL_PASSWORD: ${PANEL_PASSWORD:?set PANEL_PASSWORD in .env}
      PANEL_ANALYSTS: ${PANEL_ANALYSTS:-lead-analyst,analyst-1,analyst-2}
      # The reference set lives in git, not in the state store (ADR-011), so the
      # panel reads it from the repository and writes nominations back there.
      REPO_ROOT: /repo
    ports:
      # Loopback on the host, reached through an ssh tunnel like everything else.
      - "127.0.0.1:8081:8081"
    volumes:
      - mcp-state:/state
      - ..:/repo
    mem_limit: 256m

networks:
  observability:
    external: true
    name: observability_default

volumes:
  oracle-data:
  mcp-state:
