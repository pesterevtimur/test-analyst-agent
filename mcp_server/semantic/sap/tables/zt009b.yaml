name: ZT009B
title: Календарь периодов
description: >
  Соответствие дат периодам, кварталам и годам. Нужен всегда, когда вопрос
  задан в терминах периода, а не конкретных дат.
grain: одна строка это один календарный день
columns:
  - name: MANDT
    title: Мандант
    type: string
    description: Номер контура, фильтр обязателен.
    required_filter: "= '100'"
  - name: BUDAT
    title: Дата проводки
    type: date
    key: true
    description: Календарный день. Связывается с FKDAT из ZVBRP.
  - name: SPMON
    title: Период, год и месяц
    type: string
    description: >
      Год и месяц слитно, без разделителя, например 202106. Классическая
      ошибка, написать 2021-06.
  - name: POPER
    title: Номер периода
    type: string
    description: Номер месяца тремя знаками с ведущими нулями, например 006.
  - name: BDATJ
    title: Год, строкой
    type: string
    description: Год в виде строки. Для арифметики есть числовой GJAHR.
  - name: QUARTAL
    title: Квартал
    type: string
    description: >
      Квартал в виде строки год-дефис-номер, например 2021-02. Номер квартала
      идёт вторым, а не первым, и это не месяц.
  - name: GJAHR
    title: Год, числом
    type: number
    description: Год числом, для сравнений и арифметики.
gotchas:
  - id: quartal-format
    severity: critical
    text: >
      Квартал записан строкой вида 2021-02, где 02 это номер квартала, а не
      месяца. Второй квартал 2021 года это '2021-02', а не '2021-2', не 'Q2
      2021' и не месяц февраль. Фильтр в другом формате вернёт пусто без ошибки.
    wrong: WHERE quartal = 'Q2 2021'
    right: WHERE quartal = '2021-02'
  - id: spmon-format
    severity: warning
    text: >
      Период SPMON пишется слитно, 202106. Формат с дефисом вернёт пусто.
  - id: data-range
    severity: warning
    text: >
      Данные покрывают 2019-2023 годы. Вопрос про 2001 год вернёт пусто, и это
      не ошибка запроса, а отсутствие данных. Старые примеры по схеме Sales
      History ссылаются на 1998-2001, эта редакция схемы перенесена вперёд.
typical_filters:
  - "mandt = '100'"
  - "quartal = '2021-02'"
  - "gjahr = 2021"
