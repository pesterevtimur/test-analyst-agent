name: sap
title: Витрина продаж в именах SAP
db_schema: SH
description: >
  Те же данные, что и в домене sh, но под именами и правилами SAP. Здесь
  таблица называется ZVBRP, а не SALES, поле называется NETWR, а не
  amount_sold, и у каждой таблицы есть мандант, язык и признак удаления.
  Домен существует затем, чтобы задача выглядела так, как она выглядит в
  настоящем контуре заказчика: имя поля не читается человеком, и без словаря
  запрос не собрать.
