[project]
name = "sap-agent-mcp"
version = "0.1.0"
description = "MCP server giving a data-analyst agent read-only access to Oracle and SAP-shaped data"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.9",
    "oracledb>=3.0",  # the python-oracledb driver ships under this name,
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
