<html lang="ru">
<head><meta charset="utf-8"><title>Вход</title></head>
<body style="font: 15px system-ui, sans-serif; padding: 40px;">
  <h1 style="font-size:18px">Панель аналитика</h1>
  <form method="post" action="/login">
    <input type="password" name="password" autofocus placeholder="Пароль">

  <p style="color:#6b6b6b;font-size:13px;max-width:46em">

    промышленной эксплуатации, сказано в docs/limits.md.
  </p>
</body>
